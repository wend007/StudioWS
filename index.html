
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aquário Virtual</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🌊 Aquário Virtual</h1>
    <p>Um pequeno mundo subaquático para explorar</p>
  </header>

  <main>
    <section class="tank" id="tank">
      <div class="sunlight"></div>
      <div class="water-surface"></div>

      <div class="plant plant-one">🌿</div>
      <div class="plant plant-two">🌱</div>
      <div class="reef">🪸</div>
      <div class="sand"></div>

      <div class="fish swimming fish-one" data-fish="clown">
        <svg viewBox="0 0 120 80" role="img" aria-label="Peixe-palhaço">
          <g class="tail">
  <path d="M25 40 L4 18 L7 62 Z" fill="#ff9d25" stroke="#163b50" stroke-width="3"/>
</g>
          <ellipse cx="59" cy="40" rx="39" ry="25" fill="#ff8a20" stroke="#163b50" stroke-width="3"/>
          <path d="M43 18 Q32 40 43 62 L53 64 Q64 40 53 16Z" fill="white" stroke="#163b50" stroke-width="3"/>
          <path d="M72 17 Q60 40 72 63 L82 59 Q90 40 82 21Z" fill="white" stroke="#163b50" stroke-width="3"/>
          <g class="fin">
  <path d="M47 17 Q60 4 75 17" fill="#ff8a20" stroke="#163b50" stroke-width="3"/>
</g>
          <circle cx="88" cy="34" r="5" fill="white"/>
          <circle cx="90" cy="34" r="2.5" fill="#102438"/>
        </svg>
      </div>

      <div class="fish swimming fish-two" data-fish="tang">
        <svg viewBox="0 0 120 80" role="img" aria-label="Peixe-cirurgião-azul">
          <path d="M23 40 L3 20 L7 60Z" fill="#ffda32" stroke="#163b50" stroke-width="3"/>
          <path d="M22 40 Q37 5 77 17 Q99 27 104 40 Q94 62 68 65 Q36 70 22 40Z" fill="#1687ff" stroke="#102e60" stroke-width="3"/>
          <path d="M36 23 Q65 16 78 27 Q69 37 42 36Z" fill="#061e58"/>
          <path d="M42 45 Q68 40 83 52 Q63 66 42 57Z" fill="#071e5b"/>
          <g class="fin side-fin">
            <path d="M53 43 Q66 43 73 54 Q64 61 54 52Z" fill="#3aa9ff" stroke="#102e60" stroke-width="2"/>
          </g>
          <circle cx="90" cy="35" r="4" fill="white"/>
          <circle cx="91" cy="35" r="2" fill="#102438"/>
        </svg>
      </div>

      <div class="fish swimming fish-three" data-fish="puffer">
        <svg viewBox="0 0 120 80" role="img" aria-label="Baiacu">
          <path d="M23 42 L5 25 L8 58Z" fill="#e8b93c" stroke="#6d5924" stroke-width="3"/>
          <ellipse cx="61" cy="41" rx="38" ry="29" fill="#f4d65e" stroke="#6d5924" stroke-width="3"/>
          <g class="fin side-fin">
            <path d="M52 45 Q64 45 70 56 Q61 62 52 54Z" fill="#e8b93c" stroke="#6d5924" stroke-width="2"/>
          </g>
          <path d="M37 17 L43 8 L48 15 M64 12 L69 4 L73 15 M85 22 L95 17 L91 28" fill="#f4d65e" stroke="#6d5924" stroke-width="2"/>
          <circle cx="79" cy="32" r="5" fill="white"/>
          <circle cx="80" cy="32" r="2.5" fill="#102438"/>
          <circle cx="49" cy="36" r="2" fill="#9b7928"/>
          <circle cx="60" cy="50" r="2" fill="#9b7928"/>
          <circle cx="42" cy="47" r="2" fill="#9b7928"/>
        </svg>
      </div>

      <div class="bubbles" id="bubbles"></div>
    </section>

    <section class="info">
      <div class="details">
        <span class="tag">GUIA MARINHO</span>
        <h2 id="fish-name">Explore o aquário</h2>
        <p id="fish-description">Selecione um peixe para descobrir mais sobre sua biologia.</p>
        <div class="facts">
          <div><span>HABITAT</span><p id="habitat">—</p></div>
          <div><span>ALIMENTAÇÃO</span><p id="food">—</p></div>
        </div>
      </div>
      <div class="actions">
        <button id="feed">Dar comida</button>
        <p id="message">Observe os peixes nadando.</p>
        <span class="counter" id="counter">Alimentações: 0</span>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
